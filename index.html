<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>91 CLUB</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
.login-box{padding:20px;text-align:center;background:#fff;min-height:100vh}
.logo{font-size:28px;font-weight:900;color:#ff0000;margin:30px 0}
input{width:90%;padding:14px;margin:10px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
.btn{width:90%;padding:14px;background:#ff0000;color:#fff;border:none;border-radius:25px;font-size:18px;font-weight:800;margin-top:20px}
</style>
</head>
<body>
<div class="login-box" id="login">
<div class="logo">91 CLUB</div>
<p style="color:#666">Login to Kanpur91</p>
<input id="mob" placeholder="Phone number">
<input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="go()">LOGIN</button>
<p style="margin-top:20px;color:#999;font-size:12px">kanpur91.com clone</p>
</div>

<div id="home" style="display:none">
<div style="background:#ff0000;color:#fff;padding:10px;display:flex;justify-content:space-between">
<span>91 CLUB</span><span>₹0.34</span>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px">
<div onclick="alert('Win Go Start')" style="background:#fff;padding:15px;border-radius:10px;text-align:center">🎯<br>Win Go</div>
<div style="background:#fff;padding:15px;border-radius:10px;text-align:center">🔢<br>5D</div>
<div style="background:#fff;padding:15px;border-radius:10px;text-align:center">⚡<br>TRX</div>
</div>
<div style="background:#000;color:#fff;margin:10px;border-radius:10px;padding:10px">🔥 CHICKEN ROAD 3 - HOT</div>
</div>

<script>
function go(){
 if(mob.value.length>=10){login.style.display='none';home.style.display='block';}
 else alert('Number dal bhai');
}
</script>
</body>
</html>
